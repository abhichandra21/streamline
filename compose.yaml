# Run from a checkout of the repo:
#
#   mkdir -p data recommender/cache logs
#   touch config.local.yaml    # must exist as a file before the first start
#   docker compose up -d       # then open http://localhost:5051 and follow Get started
#
# Keys can also go in .env, and setup also runs from the terminal:
#   docker compose run --rm streamline ./recommend setup
# See https://streamline-docs.pages.dev/guides/docker/
services:
  streamline:
    image: ghcr.io/abhichandra21/streamline:latest
    build: .
    # Run as your own user so the bind mounts stay writable: set PUID/PGID in .env (see `id`).
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - path: .env
        required: false
    ports:
      - "5051:5051"
    volumes:
      - ./data:/app/data
      - ./recommender/cache:/app/recommender/cache
      - ./logs:/app/logs
      # config.yaml holds the shipped defaults; the Settings page saves changes to config.local.yaml.
      - ./config.yaml:/app/config.yaml:ro
      - ./config.local.yaml:/app/config.local.yaml
    restart: unless-stopped
