# Streamline configuration
# Set API keys in the environment. .env is optional local convenience.

log_level: DEBUG
provider: anthropic
models:
  anthropic:
    fast: claude-haiku-4-5-20251001
    reason: claude-sonnet-4-6
  gemini:
    fast: gemini-2.5-flash
    reason: gemini-2.5-pro
  openai:
    fast: gpt-4.1-mini
    reason: gpt-4.1
    base_url:                           # empty = api.openai.com, or custom endpoint
llm:
  timeout_fast: 30
  timeout_reason: 60
  timeout_profile_batch: 120
  timeout_profile_merge: 300
  tokens_fast: 300
  tokens_intent: 400
  tokens_ranking: 1000
  tokens_suggestions: 300
  tokens_profile_batch: 4000
  tokens_profile_merge: 16000
  tokens_abandoned: 300
  profile_batch_size: 200
  rate_limit_wait: 65
default_top_n: 3
min_vote_count: 20
min_rating: 6.5
min_year: 2000
recency_half_life_days: 90
scoring:
  weight_completion: 0.5
  weight_rewatch: 0.3
  weight_recency: 0.2
  default_tv_runtime: 45
  default_movie_runtime: 90
  rewatch_saturation: 5
manual:
  timestamp: now
  tv_duration_minutes: 45
  movie_duration_minutes: 120
watch_region: US
streaming_platforms: []
platform_paths:
  netflix: data/netflix/2468198246996321264/CONTENT_INTERACTION/ViewingActivity.csv
  prime: data/prime_video/Your Prime Video Viewing Activity/Viewing History.csv
manual_tv_path: data/manual/tv.csv
manual_movies_path: data/manual/movies.csv
overrides_path: data/overrides.json
