{% extends "base.html" %}
{% block title %}Streamline — Your Shows{% endblock %}
{% block content %}
<div class="shows-heading">
  <span class="mono shows-kicker">Release inbox</span>
  <h1>Your Shows</h1>
  <p>New episodes and returning favorites from shows you have already watched.</p>
</div>

{% include "_shows_content.html" %}

<style>
  .shows-heading { margin-bottom: 2rem; }
  .shows-heading h1 {
    font-size: clamp(2.25rem, 5vw, 3.35rem);
    line-height: 1.05;
    margin: 0.2rem 0 0.45rem;
  }
  .shows-heading p { color: var(--muted); max-width: 36rem; }
  .shows-kicker {
    color: var(--teal);
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .shows-status {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    min-height: 1.5rem;
    margin: -0.75rem 0 1.25rem;
    color: var(--muted);
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .shows-spinner {
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  .shows-section { margin-top: 2.2rem; }
  .shows-section-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.55rem;
    margin-bottom: 0.8rem;
  }
  .shows-section-heading h2 { font-size: 1.45rem; }
  .shows-count { color: var(--muted); font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; }
  .shows-list { display: flex; flex-direction: column; gap: 0.7rem; }
  .show-card {
    display: grid;
    grid-template-columns: 58px minmax(0, 1fr) auto;
    gap: 0.9rem;
    align-items: center;
    padding: 0.85rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
  }
  .show-poster,
  .show-poster-empty {
    width: 58px;
    aspect-ratio: 2 / 3;
    border-radius: 4px;
    object-fit: cover;
    background: var(--surface2);
  }
  .show-poster-empty { display: grid; place-items: center; color: var(--border); font-size: 1.4rem; }
  .show-card h3 { font-size: 1.15rem; line-height: 1.2; margin-bottom: 0.2rem; }
  .show-card-copy { color: var(--muted); font-size: 0.8rem; }
  .show-card-detail { color: var(--body); }
  .show-actions { display: flex; align-items: center; justify-content: flex-end; gap: 0.4rem; flex-wrap: wrap; }
  .show-actions button { padding: 0.42rem 0.7rem; white-space: nowrap; }
  .show-inline-form { display: inline; margin: 0; }
  .shows-empty {
    padding: 1rem 1.1rem;
    border: 1px dashed var(--border);
    border-radius: 7px;
    color: var(--muted);
    font-size: 0.82rem;
  }
  .shows-management { margin-top: 2.5rem; border-top: 1px solid var(--border); padding-top: 1rem; }
  .shows-management summary {
    color: var(--muted);
    cursor: pointer;
    font-size: 0.62rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }
  .shows-management .shows-list { margin-top: 0.8rem; }
  @media (max-width: 640px) {
    .show-card { grid-template-columns: 48px minmax(0, 1fr); }
    .show-poster, .show-poster-empty { width: 48px; }
    .show-actions { grid-column: 1 / -1; justify-content: flex-start; padding-left: 3.55rem; }
  }
</style>
{% endblock %}
