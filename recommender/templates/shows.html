{% extends "base.html" %}
{% block title %}Streamline — Your Shows{% endblock %}
{% block content %}
<div class="shows-heading">
  <span class="mono shows-kicker">Release inbox</span>
  <h1>Your Shows</h1>
</div>

{% include "_shows_content.html" %}

<style>
  /* ── Masthead: compact, because this page gets revisited weekly ── */
  .shows-heading { margin-bottom: 1.1rem; }
  .shows-heading h1 {
    font-size: clamp(1.85rem, 3.4vw, 2.35rem);
    line-height: 1.1;
    margin: 0.1rem 0 0;
  }
  .shows-kicker {
    color: var(--teal);
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* ── State bar: the whole page's status in one line, above the fold ── */
  .shows-statebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    padding-bottom: 0.7rem;
    border-bottom: 1px solid var(--border);
  }
  .shows-tally {
    font-size: 0.66rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .shows-tally strong { color: var(--text); font-weight: 500; }
  .shows-tally-sep { margin: 0 0.5rem; color: var(--border); }
  .shows-tally-quiet { color: var(--muted); text-transform: none; letter-spacing: 0.04em; }

  .shows-status {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    color: var(--muted);
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .shows-status--error {
    display: flex;
    margin: 0.9rem 0 0;
    color: var(--accent2);
    text-transform: none;
    letter-spacing: 0.04em;
    font-size: 0.72rem;
  }
  .shows-spinner {
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    flex-shrink: 0;
  }

  /* ── Refresh progress: determinate when the job knows its target count ── */
  .shows-progress {
    height: 2px;
    margin-top: 0.7rem;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }
  .shows-progress-fill {
    display: block;
    height: 100%;
    background: var(--teal);
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  .shows-progress-fill--indeterminate {
    width: 30%;
    animation: showsSlide 1.4s ease-in-out infinite;
  }
  @keyframes showsSlide {
    0%   { margin-left: -30%; }
    100% { margin-left: 100%; }
  }
  .shows-progress-note {
    margin-top: 0.45rem;
    color: var(--muted);
    font-size: 0.58rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ── Sections ── */
  .shows-section { margin-top: 2.1rem; }
  .shows-section-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.55rem;
    margin-bottom: 0.8rem;
  }
  .shows-section-heading h2 { font-size: 1.45rem; }
  .shows-count { color: var(--muted); font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; }
  .shows-list { display: flex; flex-direction: column; gap: 0.7rem; }

  /* ── Show rows ── */
  .show-card {
    display: grid;
    grid-template-columns: 58px minmax(0, 1fr) auto;
    gap: 0.9rem;
    align-items: center;
    padding: 0.85rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
  }
  /* Ready now is the payoff, so it carries the most weight on the page. */
  .show-card--ready {
    grid-template-columns: 72px minmax(0, 1fr) auto;
    padding: 1rem;
    border-color: rgba(58,184,160,0.28);
  }
  .show-card--ready .show-poster,
  .show-card--ready .show-poster-empty { width: 72px; }
  .show-ready-count {
    color: var(--teal);
    font-size: 0.64rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    margin-bottom: 0.1rem;
  }

  .show-poster,
  .show-poster-empty {
    width: 58px;
    aspect-ratio: 2 / 3;
    border-radius: 4px;
    object-fit: cover;
    background: var(--surface2);
  }
  .show-poster--sm { width: 44px !important; }
  .show-poster-empty { display: grid; place-items: center; color: var(--border); font-size: 1.4rem; }
  .show-row-body { min-width: 0; }
  .show-card h3, .show-row h3 { font-size: 1.15rem; line-height: 1.2; margin-bottom: 0.2rem; }
  .show-card--ready h3 { font-size: 1.3rem; }
  .show-card-copy { color: var(--muted); font-size: 0.8rem; }
  .show-card-detail { color: var(--body); }
  .show-actions { display: flex; align-items: center; justify-content: flex-end; gap: 0.4rem; flex-wrap: wrap; }
  .show-actions button { padding: 0.42rem 0.7rem; white-space: nowrap; }
  .show-inline-form { display: inline; margin: 0; }

  /* Quiet secondary action: present, but never competing with the primary. */
  .btn-quiet {
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .btn-quiet:hover { color: var(--text); border-color: var(--border); }
  .btn-quiet--bare { padding: 0.2rem 0.3rem !important; font-size: 0.55rem; }

  /* ── Decision queue: its own surface, so it reads as one finite task ── */
  .shows-decisions {
    margin-top: 2.1rem;
    border: 1px solid rgba(232,93,74,0.3);
    border-radius: 8px;
    background:
      linear-gradient(180deg, rgba(232,93,74,0.05), transparent 55%),
      var(--surface);
    padding: 0.95rem 1rem 1rem;
  }
  .shows-decisions-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 0.35rem;
  }
  .shows-decisions-heading h2 { font-size: 1.3rem; }
  .shows-decisions-heading .shows-count { color: var(--accent); }
  .shows-decisions-list { display: flex; flex-direction: column; }
  .show-decision-row,
  .show-row--settled {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) auto;
    gap: 0.85rem;
    align-items: center;
    padding: 0.7rem 0;
    border-top: 1px solid var(--border);
  }
  .show-decision-row h3, .show-row--settled h3 { font-size: 1.05rem; }
  .shows-decisions-rest { margin-top: 0.2rem; }
  .shows-decisions-rest summary {
    padding: 0.6rem 0;
    border-top: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-size: 0.6rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }
  .shows-decisions-rest summary:hover { color: var(--text); }
  .shows-decisions-clear {
    margin-top: 2.1rem;
    padding: 0.75rem 0.9rem;
    border: 1px dashed var(--border);
    border-radius: 7px;
    color: var(--muted);
    font-size: 0.6rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  /* ── Settled state ──
     Each variant matches the shape it replaced, so acting on a row changes
     its contents without changing its height. Nothing below it moves. */
  .show-row--settled { animation: settleIn 0.22s ease both; }

  /* Replaces a poster card. Two sizes, matching the two card sizes in use. */
  .show-row--settled.show-row--card,
  .show-row--settled.show-row--card-lg {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
  }
  .show-row--settled.show-row--card {
    grid-template-columns: 58px minmax(0, 1fr) auto;
    gap: 0.9rem;
    padding: 0.85rem;
  }
  .show-row--settled.show-row--card-lg {
    grid-template-columns: 72px minmax(0, 1fr) auto;
    gap: 0.9rem;
    padding: 1rem;
  }
  .show-row--settled.show-row--card-lg .show-poster,
  .show-row--settled.show-row--card-lg .show-poster-empty { width: 72px; }
  .show-row--settled.show-row--card-lg h3 { font-size: 1.3rem; }

  /* Replaces a compact calendar line, so it stays a single line. */
  .show-row--settled.show-row--line {
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 0.9rem;
    padding: 0.42rem 0;
    border-top: 1px solid rgba(53,47,64,0.55);
  }
  .show-row--settled.show-row--line .show-poster,
  .show-row--settled.show-row--line .show-poster-empty { display: none; }
  .show-row--settled.show-row--line h3 {
    display: inline;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem;
    margin: 0;
  }
  .show-row--settled.show-row--line .show-row-body {
    display: flex;
    gap: 0.6rem;
    align-items: baseline;
    white-space: nowrap;
    overflow: hidden;
  }
  .show-row--settled.show-row--line .show-card-copy { font-size: 0.68rem; }
  /* Match the calendar's bare button metrics, or the line grows taller. */
  .show-row--settled.show-row--line .show-actions { flex-wrap: nowrap; }
  .show-row--settled.show-row--line .show-actions button {
    padding: 0.2rem 0.3rem;
    font-size: 0.55rem;
  }

  .show-row--teal .show-settled-mark { color: var(--teal); }
  .show-row--muted { opacity: 0.55; }
  .show-row--muted .show-settled-mark { color: var(--muted); }
  .show-settled-mark { margin-right: 0.3rem; }
  @keyframes settleIn {
    from { opacity: 0.3; }
    to   { opacity: 1; }
  }
  .show-row--muted { animation: settleInMuted 0.22s ease both; }
  @keyframes settleInMuted {
    from { opacity: 0.2; }
    to   { opacity: 0.55; }
  }

  /* ── Coming soon: a calendar. Dense dated lines, not cards. ── */
  .shows-section--soon .shows-section-heading h2 {
    font-size: 0.66rem;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--body);
  }
  .soon-list { display: flex; flex-direction: column; }
  .soon-row {
    display: grid;
    grid-template-columns: 5.6rem minmax(0, 1fr) auto auto;
    gap: 0.9rem;
    align-items: baseline;
    padding: 0.42rem 0;
    border-top: 1px solid rgba(53,47,64,0.55);
  }
  .soon-row:first-child { border-top: none; }
  .soon-date { color: var(--body); font-size: 0.68rem; letter-spacing: 0.03em; }
  .soon-title { color: var(--text); font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .soon-slug { color: var(--muted); font-size: 0.6rem; letter-spacing: 0.06em; }
  .soon-row--undated .soon-date { color: var(--muted); }
  /* A settled row landing in the calendar keeps the calendar's own rhythm. */
  .soon-list .show-row--settled { grid-template-columns: 44px minmax(0, 1fr) auto; }

  .shows-empty {
    padding: 1rem 1.1rem;
    border: 1px dashed var(--border);
    border-radius: 7px;
    color: var(--muted);
    font-size: 0.82rem;
  }
  .shows-management { margin-top: 2.5rem; border-top: 1px solid var(--border); padding-top: 1rem; }
  .shows-management summary {
    color: var(--muted);
    cursor: pointer;
    font-size: 0.62rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }
  .shows-management .shows-list { margin-top: 0.8rem; }

  @media (max-width: 640px) {
    .show-card { grid-template-columns: 48px minmax(0, 1fr); }
    .show-card--ready { grid-template-columns: 56px minmax(0, 1fr); }
    .show-poster, .show-poster-empty { width: 48px; }
    .show-card--ready .show-poster,
    .show-card--ready .show-poster-empty { width: 56px; }
    .show-card .show-actions { grid-column: 1 / -1; justify-content: flex-start; padding-left: 3.55rem; }
    .show-decision-row,
    .show-row--settled { grid-template-columns: 44px minmax(0, 1fr); }
    .show-decision-row .show-actions,
    .show-row--settled .show-actions { grid-column: 1 / -1; justify-content: flex-start; padding-left: 3.3rem; }
    /* The calendar folds to two lines rather than squeezing four columns. */
    .soon-row { grid-template-columns: 5.2rem minmax(0, 1fr); row-gap: 0.15rem; }
    .soon-slug { grid-column: 2; }
    .soon-row .show-inline-form { grid-column: 2; }
  }
</style>
{% endblock %}
