<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Streamline{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/logo.png">
  <script src="https://unpkg.com/htmx.org@2.0.2" integrity="sha384-Y7hw+L/jvKeWIRRkqWYfPcvVxHzVzn5REgzbawhxAuQGwX1XWe70vji+VSeHOThJ" crossorigin="anonymous"></script>
  <script>
    // Inject CSRF token into every HTMX request automatically
    document.addEventListener('htmx:configRequest', function(evt) {
      evt.detail.headers['X-CSRF-Token'] = '{{ csrf_token }}';
    });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #141118;
      --surface:   #1c1922;
      --surface2:  #24202c;
      --border:    #352f40;
      --accent:    #e85d4a;
      --accent2:   #f0a040;
      --teal:      #3ab8a0;
      --lavender:  #a78bfa;
      --text:      #f2eff6;
      --body:      #c8c2d0;
      --muted:     #7e7690;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--body);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: 15px;
      line-height: 1.7;
      min-height: 100vh;
    }

    /* Subtle radial glow behind content */
    body::after {
      content: '';
      position: fixed;
      top: -20%; left: 50%; transform: translateX(-50%);
      width: 120vw; height: 60vh;
      background: radial-gradient(ellipse, rgba(232,93,74,0.04) 0%, rgba(167,139,250,0.03) 40%, transparent 70%);
      pointer-events: none;
      z-index: -1;
    }

    /* Typography */
    h1, h2, h3, .display {
      font-family: 'DM Serif Display', serif;
      color: var(--text);
      font-weight: 400;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Navigation */
    nav {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 0 2rem;
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .nav-brand {
      font-family: 'DM Serif Display', serif;
      font-size: 1.15rem;
      color: var(--text);
      letter-spacing: 0.04em;
      text-decoration: none;
    }
    .nav-link {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      padding-bottom: 2px;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .nav-link:hover { color: var(--text); text-decoration: none; }
    .nav-link.active { color: var(--text); border-bottom-color: var(--accent); }

    /* Inputs */
    .input-field {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      border-radius: 4px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field::placeholder { color: var(--muted); }
    .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232,93,74,0.1);
    }

    /* Buttons */
    .btn-primary {
      background: var(--accent);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-primary:hover { background: #d04a38; transform: translateY(-1px); }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--text); text-decoration: none; }

    /* Badge */
    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 3px;
      display: inline-block;
    }
    .badge-tv { background: rgba(58,184,160,0.15); color: var(--teal); }
    .badge-movie { background: rgba(167,139,250,0.15); color: var(--lavender); }

    /* Stat */
    .stat-number {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      line-height: 1;
      color: var(--text);
    }
    .stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    /* HTMX */
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator,
    .htmx-request.htmx-indicator { display: flex; }

    /* Results animation */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .result-card { animation: slideUp 0.3s ease both; }
    .result-card:nth-child(1) { animation-delay: 0s; }
    .result-card:nth-child(2) { animation-delay: 0.05s; }
    .result-card:nth-child(3) { animation-delay: 0.1s; }
    .result-card:nth-child(4) { animation-delay: 0.15s; }
    .result-card:nth-child(5) { animation-delay: 0.2s; }

    /* Page */
    @keyframes pageFade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    main { animation: pageFade 0.25s ease both; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>

  <nav>
    <a href="/" class="nav-brand"><img src="/static/logo.png" alt="Streamline" style="height:22px; width:22px; vertical-align:middle; margin-right:0.4rem; border-radius:3px;">Streamline</a>
    <div style="display:flex; gap:1.5rem; margin-left:0.5rem; flex:1;">
      <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Home</a>
      <a href="/searches" class="nav-link {% if request.path == '/searches' %}active{% endif %}">Searches</a>
      <a href="/history" class="nav-link {% if request.path.startswith('/history') or request.path.startswith('/title') %}active{% endif %}">Archive</a>
      <a href="/settings" class="nav-link {% if request.path == '/settings' %}active{% endif %}">Settings</a>
    </div>
    <a href="/help" class="nav-link {% if request.path == '/help' %}active{% endif %}">Help</a>
  </nav>

  <main style="max-width:54rem; margin:0 auto; padding:2.5rem 2rem 5rem;">
    {% block content %}{% endblock %}
  </main>

  <footer style="border-top:1px solid var(--border); padding:1.5rem 2rem; display:flex; align-items:center; justify-content:center; gap:1.5rem; flex-wrap:wrap;">
    <span class="mono" style="font-size:0.58rem; letter-spacing:0.08em; color:var(--muted);">
      {{ footer_provider }} / {{ footer_model }}
    </span>
    {% if footer_profile_built_at %}
    <span style="color:var(--border);">·</span>
    <span class="mono" style="font-size:0.58rem; letter-spacing:0.08em; color:var(--muted);">
      profile built {{ footer_profile_built_at[:10] }}
    </span>
    {% endif %}
    <span style="color:var(--border);">·</span>
    <a href="/status" class="mono" style="font-size:0.58rem; letter-spacing:0.08em; color:var(--muted); text-decoration:none;">status</a>
    <span style="color:var(--border);">·</span>
    <a href="https://github.com/abhichandra21/streamline" target="_blank" rel="noopener" class="mono" style="font-size:0.58rem; letter-spacing:0.08em; color:var(--muted); text-decoration:none;">github</a>
  </footer>

</body>
</html>
