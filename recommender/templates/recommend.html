{% extends "base.html" %}
{% block title %}Streamline — Discover{% endblock %}
{% block content %}

<div style="margin-bottom:2rem;">
  <span class="mono" style="font-size:0.62rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent);">AI Curation</span>
  <h1 style="font-size:clamp(2rem, 4.5vw, 3rem); margin-top:0.2rem; margin-bottom:1.25rem;">Discover</h1>

  <form
    id="search-form"
    method="post" action="/recommend"
    hx-post="/recommend" hx-target="#results" hx-swap="innerHTML" hx-indicator="#spinner"
    style="display:flex; gap:0; max-width:680px;"
  >
    <input
      type="text" name="query" value="{{ query }}"
      placeholder="slow-burn British crime drama..."
      class="input-field"
      style="padding:0.85rem 1.25rem; flex:1; border-radius:4px 0 0 4px; border-right:none;"
      autofocus
    >
    <button type="submit" class="btn-primary" style="padding:0.85rem 1.5rem; border-radius:0 4px 4px 0;">Search</button>
  </form>

  <div id="spinner" class="htmx-indicator" style="align-items:center; gap:0.6rem; margin-top:1rem;">
    <div style="width:14px; height:14px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.6s linear infinite;"></div>
    <span class="mono" style="font-size:0.65rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted);">Finding matches...</span>
  </div>
</div>

<div id="results">
  {% if results is not none %}
    {% include "_results.html" %}
  {% endif %}
</div>

{% endblock %}
