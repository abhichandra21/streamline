services:
  streamline:
    build: .
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
      - streamline-cache:/app/recommender/cache
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STREAMLINE_PASSWORD=${STREAMLINE_PASSWORD:-}
      - STREAMLINE_SECRET_KEY=${STREAMLINE_SECRET_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  streamline-cache:
